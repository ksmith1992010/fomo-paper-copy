<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Podium</title>
  <link rel="icon" type="image/png" href="/podium-logo.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="grid-overlay" aria-hidden="true"></div>
  <div class="scan" aria-hidden="true"></div>
  <main>
    <header class="deck">
      <div class="brand">
        <img class="mark" src="/podium-logo.png" alt="" width="76" height="76">
        <div>
          <p class="kicker">Paper copy · command deck</p>
          <h1>PODIUM</h1>
          <p id="source">Acquiring the board…</p>
          <p class="book">Simulated book · $1,000</p>
        </div>
      </div>
      <div class="header-meta">
        <div class="reactor" aria-hidden="true">
          <i class="orbit"></i>
          <i class="orbit inner"></i>
          <i class="core"></i>
        </div>
        <div class="meta-copy">
          <p id="clock">--:--:-- UTC</p>
          <button id="refresh" type="button">Sync</button>
        </div>
      </div>
    </header>
    <div id="banner"></div>
    <section class="stats" id="stats"></section>
    <section class="grid" id="traders"></section>
    <h2>Trade tape</h2>
    <div class="panel frame" id="trades"></div>
    <h2>Open positions</h2>
    <div class="panel frame" id="positions"></div>
    <footer id="foot"></footer>
  </main>
  <script type="module" src="/app.js"></script>
  <script>window.__FEED__ = /*__FEED__*/null;</script>
</body>
</html>
